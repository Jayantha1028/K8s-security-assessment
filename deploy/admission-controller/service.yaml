apiVersion: v1
kind: Service
metadata:
  name: k8s-security-webhook
  namespace: k8s-security
  labels:
    app.kubernetes.io/name: k8s-security-webhook
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: k8s-security-webhook

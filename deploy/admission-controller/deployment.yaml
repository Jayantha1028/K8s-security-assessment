apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-security-webhook
  namespace: k8s-security
  labels:
    app.kubernetes.io/name: k8s-security-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-security-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-security-webhook
    spec:
      serviceAccountName: k8s-security-webhook-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: k8s-security-platform:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - src/integrations/admission_webhook.py
            - --host=0.0.0.0
            - --port=8443
            - --cert=/etc/webhook/certs/tls.crt
            - --key=/etc/webhook/certs/tls.key
            - --risk-threshold=35.0
          ports:
            - containerPort: 8443
              name: https
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: certs
          secret:
            secretName: k8s-security-webhook-tls
        - name: tmp
          emptyDir: {}

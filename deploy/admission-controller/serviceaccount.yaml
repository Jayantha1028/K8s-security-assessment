apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-security-webhook-sa
  namespace: k8s-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-security-webhook-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-security-webhook-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-security-webhook-role
subjects:
  - kind: ServiceAccount
    name: k8s-security-webhook-sa
    namespace: k8s-security

apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: k8s-security-mutating-webhook
  labels:
    app.kubernetes.io/name: k8s-security-webhook
webhooks:
  - name: mutate.security.k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 3
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "k8s-security"]
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "Namespaced"
      - operations: ["CREATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "daemonsets", "statefulsets"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: k8s-security-webhook
        namespace: k8s-security
        path: "/mutate"
        port: 443
      caBundle: ${CA_BUNDLE}

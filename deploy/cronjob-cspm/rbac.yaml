apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-security-cspm-sa
  namespace: k8s-security
  labels:
    app.kubernetes.io/name: k8s-security-cspm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-security-cspm-role
  labels:
    app.kubernetes.io/name: k8s-security-cspm
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-security-cspm-binding
  labels:
    app.kubernetes.io/name: k8s-security-cspm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-security-cspm-role
subjects:
  - kind: ServiceAccount
    name: k8s-security-cspm-sa
    namespace: k8s-security

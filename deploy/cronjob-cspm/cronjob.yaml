apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-security-cluster-audit
  namespace: k8s-security
  labels:
    app.kubernetes.io/name: k8s-security-cspm
spec:
  schedule: "0 */6 * * *"  # Runs every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k8s-security-cspm
        spec:
          serviceAccountName: k8s-security-cspm-sa
          restartPolicy: OnFailure
          containers:
            - name: cluster-auditor
              image: k8s-security-platform:v2.0.0
              imagePullPolicy: IfNotPresent
              command:
                - "k8s-sec"
                - "scan-cluster"
                - "--gate"
                - "--threshold"
                - "35.0"
              resources:
                limits:
                  cpu: "500m"
                  memory: "512Mi"
                requests:
                  cpu: "100m"
                  memory: "128Mi"
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault

apiVersion: v1
kind: Namespace
metadata:
  name: security-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: security-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-read-pods
  namespace: security-demo
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-read-pods
  namespace: security-demo
subjects:
- kind: ServiceAccount
  name: demo-app
  namespace: security-demo
roleRef:
  kind: Role
  name: demo-read-pods
  apiGroup: rbac.authorization.k8s.io

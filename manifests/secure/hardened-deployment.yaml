apiVersion: apps/v1
kind: Deployment
metadata:
  name: secured-app
  namespace: security-demo
  labels:
    app: secured-app
    tier: hardened
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secured-app
  template:
    metadata:
      labels:
        app: secured-app
    spec:
      serviceAccountName: demo-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: caddy:2.11-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "250m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        ports:
        - containerPort: 80
        volumeMounts:
        - { name: data,   mountPath: /data }
        - { name: config, mountPath: /config }
      volumes:
      - { name: data,   emptyDir: {} }
      - { name: config, emptyDir: {} }

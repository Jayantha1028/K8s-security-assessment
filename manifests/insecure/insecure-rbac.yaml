apiVersion: v1
kind: Namespace
metadata:
  name: security-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: security-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-overprivileged
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-overprivileged
subjects:
- kind: ServiceAccount
  name: demo-app
  namespace: security-demo
roleRef:
  kind: ClusterRole
  name: demo-overprivileged
  apiGroup: rbac.authorization.k8s.io

name: CDC-5 Kubernetes Security Gate (Shift-Left CI/CD)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-gate:
    name: ML-Based Kubernetes Security Gate & 56-Vulnerability Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Verification (48 Tests)
        run: |
          python -m unittest discover -s tests -v

      - name: Execute Shift-Left Security Gate Linter
        id: security_gate
        run: |
          python src/ci_security_gate.py "manifests/**/*.yaml" --ignore-insecure

      - name: Verify Gate Interception of Hostile Insecure Manifest (Demonstration)
        id: security_gate_insecure_demo
        continue-on-error: true
        run: |
          python src/ci_security_gate.py "manifests/insecure/weak-deployment.yaml"

      - name: Post PR Summary Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/github_actions_gate_summary.md';
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: |
            reports/github_actions_gate_summary.md
            reports/11_model_comparison_report.txt

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-security.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-security.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-security.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-security.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-security.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - src/cli/main.py
            - admission
            - --host=0.0.0.0
            - --port=8443
            - --cert=/etc/webhook/certs/tls.crt
            - --key=/etc/webhook/certs/tls.key
            - --risk-threshold={{ .Values.policy.riskThreshold }}
            {{- if not .Values.policy.enableMutation }}
            - --no-mutation
            {{- end }}
            {{- if not .Values.policy.enableModel11 }}
            - --no-model-11
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "k8s-security.fullname" . }}-tls
        - name: tmp
          emptyDir: {}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-security.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-security.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: https
  selector:
    {{- include "k8s-security.selectorLabels" . | nindent 4 }}
